name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            VERSION="${BRANCH}-${SHA}"
          fi

          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="NotificationForwarder-${VERSION}.apk"

          cp "$APK_SRC" "$APK_DEST"
          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotificationForwarder-${{ env.VERSION }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets. 8935390350:AAHlZGOcCTS8acGN-kVIa-gW6sI1cFZQYL0 }}
          CHAT_ID: ${{ secrets. 6039262291 }}
        run: |
          curl -F chat_id="$CHAT_ID" \
               -F document=@"${{ env.APK_PATH }}" \
               -F caption="✅ Android Notification Forwarder APK successfully built! Version: ${{ env.VERSION }}" \
               https://telegram.org

permissions:
  contents: write
  
